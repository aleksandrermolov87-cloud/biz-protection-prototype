const FLOW = ['showcase','config','details','checkout','done'];
const app = document.getElementById('app');
const live = document.getElementById('live');
/* Верхний слой поверх страницы: диалог согласия → диалог ПЭП → боковая панель.
   При открытии фокус уходит в заголовок слоя, при закрытии — на кнопку, открывшую его. */
const layer = () => S.consent ? 'consent' : S.mismatch ? 'mismatch' : S.managerReq ? 'manager' : S.explain ? 'explain' : S.staffDelete!=null ? 'staff-del'
  : (S.signing && S.step==='checkout') ? 'code' : S.staffEdit!==null && S.staffDraft ? 'staff' : S.panel ? 'panel:'+S.panel : null;
/* Окно кода открывается с кареткой в первой ячейке, как CodeInput в приложении */
const LAYER_TITLE = {consent:'#cns-t', code:'#code-in', staff:'#stf-t', mismatch:'#mm-t', manager:'#mgr-t', explain:'#exp-t', 'staff-del':'#sdel-t'};
const layerOpener = l => l==='consent' ? '[data-act="consent"]' : l==='code' ? '[data-act="start-sign"]' : l==='staff' || l==='staff-del' ? '[data-act="staff-add"]'
  : l==='mismatch' ? '[data-act="go"][data-v="checkout"]' : l==='manager' ? '[data-act="manager-request"]' : l==='explain' ? '[data-act="terms-explain"]'
  : l==='panel:terms' ? '[data-act="terms"]' : l.startsWith('panel:doc:') ? `[data-act="doc"][data-v="${l.slice(10)}"]` : `[data-act="panel"][data-v="${l.slice(6)}"]`;
let lastLayer = null;
function afterRender(){
  const bar = app.querySelector('.flow--sticky');
  document.documentElement.style.setProperty('--flow-h', `${bar ? bar.offsetHeight : 0}px`);
  const c = calc();
  live.textContent = dmsPending() ? `Сумма за год от ${RUB(calcAt(1).premium)}, за каждого сотрудника ${RUB(empRate())}`
    : `Сумма за год ${RUB(c.premium)}${c.topup?`, включая доплату до минимальной стоимости ${RUB(c.topup)}`:''}. Суммы и лимиты — по каждому виду защиты отдельно`;
  const l = layer();
  if(l && l !== lastLayer){
    const h = app.querySelector(LAYER_TITLE[l] || '#sp-title'); if(h) h.focus();
  } else if(!l && lastLayer){
    const b = app.querySelector(layerOpener(lastLayer)); if(b) b.focus();
  }
  lastLayer = l;
}
/* Перерисовка как в React: новая разметка накладывается на существующий DOM,
   меняется только то, что изменилось. Поле с фокусом не пересоздаётся —
   каретка, выделение, открытые <details> и анимации остаются на месте. */
const sameKind = (a,b) => a.nodeType===b.nodeType && (a.nodeType!==1 || a.tagName===b.tagName);
function morphChildren(from, to){
  const byId = new Map([...from.children].filter(n=>n.id).map(n=>[n.id,n]));
  let i = 0;
  for(const next of [...to.childNodes]){
    const cur = from.childNodes[i];
    let match = next.nodeType===1 && next.id ? byId.get(next.id) : null;
    if(!match && cur && sameKind(cur,next) && !(cur.nodeType===1 && cur.id && cur.id!==next.id)) match = cur;
    if(match){ if(match!==cur) from.insertBefore(match, cur||null); morphNode(match, next); }
    else from.insertBefore(next, cur||null);
    i++;
  }
  while(from.childNodes.length > i) from.removeChild(from.lastChild);
}
function morphNode(a, b){
  if(a.nodeType!==1){ if(a.nodeValue!==b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for(const {name} of [...a.attributes]) if(!b.hasAttribute(name) && !(name==='open' && a.tagName==='DETAILS')) a.removeAttribute(name);
  for(const {name,value} of [...b.attributes]) if(a.getAttribute(name)!==value) a.setAttribute(name, value);
  if(a.tagName==='INPUT'){
    if(a.type==='checkbox' || a.type==='radio') a.checked = b.hasAttribute('checked');
    /* Поле в фокусе ведёт сам пользователь; ячейки кода — управляемые, их значение всегда из состояния */
    else if((a!==document.activeElement || a.dataset.act==='code-cell') && a.value!==(b.getAttribute('value')??'')) a.value = b.getAttribute('value')??'';
  }
  morphChildren(a, b);
  if(a.tagName==='SELECT'){ const i=[...a.options].findIndex(o=>o.hasAttribute('selected')); if(i>=0 && a.selectedIndex!==i) a.selectedIndex = i; }
}
function render(){
  refreshApproval();
  const tpl = document.createElement('template');
  tpl.innerHTML = VIEWS[S.channel][S.step]();
  morphChildren(app, tpl.content);
  afterRender();
  saveDraft(); syncHistory();
}
function rerenderKeepScroll(){
  const a=document.activeElement, id=a&&a.id;
  render();
  if(id && !app.contains(a)){ const el=document.getElementById(id); if(el && !el.disabled) el.focus({preventScroll:true}); }
}
/* Ввод через маску: форматирует, ставит каретку, отклоняет лишнее (как AmountInput) */
function rejectInput(el){
  const f = el.closest('.field'); if(!f) return;
  const ph = f.classList.contains('field--reject0') ? 1 : 0;
  f.classList.remove('field--reject0','field--reject1'); f.classList.add(`field--reject${ph}`);
}
function applyMask(el){
  const kind = el.dataset.mask, prev = el.dataset.prev ?? el.getAttribute('value') ?? '';
  const r = maskValue(kind, el.value, el.selectionStart ?? el.value.length, prev);
  const max = el.dataset.max ? +el.dataset.max : Infinity;
  if(!r || (r.digits && +r.digits > max)){
    const back = Math.max(0, (el.selectionStart ?? 0) - (el.value.length - prev.length));
    el.value = prev; el.setSelectionRange(back, back);
    if(el.dataset.act==='emp-estimate' && !S.empOver){ S.empOver = true; rerenderKeepScroll(); }
    /* вспышка отказа — только у числовых полей (AmountInput, NumberInput); маски телефона и даты молча игнорируют лишнее */
    if(kind==='amount' || kind==='count') rejectInput(el);
    return null;
  }
  el.value = r.value; el.dataset.prev = r.value;
  if(document.activeElement===el) el.setSelectionRange(r.caret, r.caret);
  return r;
}

/* ═══════════ СОБЫТИЯ ═══════════════════════════════════════════ */
app.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  /* Меню строки сотрудника закрывается по клику мимо него */
  if(S.staffMenu!=null && !e.target.closest?.('.menu, [data-act="staff-menu"]')){ S.staffMenu=null; if(!t) { rerenderKeepScroll(); return; } }
  if(!t || t.disabled) return;
  const act = t.dataset.act, v = t.dataset.v;
  if(act==='go'){
    if(v==='details'){
      const block=configBlock();
      if(block){ live.textContent=block; S.showErrors=true; const bad=badModule(); if(bad && S.sel[bad].on) S.expandedModule=bad; rerenderKeepScroll();
        (app.querySelector('[aria-invalid="true"]')||app.querySelector('#estimate-employees')||app.querySelector('[data-act="module-input"]'))?.focus(); return; }
    }
    if(v==='checkout'){
      const block=detailsBlock();
      if(block){
        live.textContent=block; S.showErrorsDetails=true; rerenderKeepScroll();
        const staffTarget=S.staffEdit!==null ? '#st-fio' : S.staff.length ? '[data-act="staff-menu"]' : '[data-act="staff-add"]';
        const noAddr=(S.sel.prop.on||S.sel.liability.on) && !S.addresses[0].addr.trim();
        const target=S.sel.dms.on && !EMPN() ? staffTarget : noAddr ? '#addr-0' : '#pay-acc';
        app.querySelector(target)?.focus();
        return;
      }
      /* Застрахованных меньше, чем указано на первом шаге, — спросить, а не менять цену молча */
      if(S.sel.dms.on && S.estimateEmployees && EMPN() < S.estimateEmployees && S.mismatchOk!==EMPN()){ S.mismatch=true; rerenderKeepScroll(); return; }
    }
    S.step = v; S.panel=null; S.codeSession=false; S.agreeErr=false;
    if(v==='showcase'){invalidateApproval();S.completedKey=null;S.signway='pep';dropDraft();}
    S.warn=null; render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(act==='back'){
    invalidateApproval();S.completedKey=null;S.agreeErr=false;
    /* Есть запись в истории — «Назад» в шапке и «назад» браузера ведут в одно место */
    if(histIdx > 0 && typeof history!=='undefined'){ history.back(); return; }
    const i=FLOW.indexOf(S.step); S.step=FLOW[Math.max(0,i-1)]; render();
  }
  else if(act==='mismatch-ok'){ S.mismatchOk=EMPN(); S.mismatch=false; S.step='checkout'; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(act==='mismatch-add'){ S.mismatch=false; lastLayer=null; rerenderKeepScroll(); app.querySelector('[data-act="staff-add"]')?.focus(); }
  else if(act==='mismatch-close'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; S.mismatch=false; rerenderKeepScroll(); }
  else if(act==='manager-request'){ S.managerReq=true; rerenderKeepScroll(); }
  else if(act==='manager-close'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; S.managerReq=false; rerenderKeepScroll(); }
  else if(act==='terms-explain'){ S.explain=v; rerenderKeepScroll(); }
  else if(act==='explain-close'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; S.explain=null; rerenderKeepScroll(); }
  else if(act==='doc'){ S.panel='doc:'+v; rerenderKeepScroll(); }
  else if(act==='draft-resume'){ const d=loadDraft(); if(d){ Object.assign(S, d); S.panel=null; S.warn=null; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
  else if(act==='section'){ toggleSection(v); rerenderKeepScroll(); }
  else if(act==='module-open'){ S.expandedModule=S.expandedModule===v?null:v; rerenderKeepScroll(); }
  else if(act==='single'){
    const keepPackage=S.step==='config' && S.flow==='package';
    if(v==='liability' || keepPackage){
      S.flow='package';S.singleModule=null;S.sel[v].on=true;
    } else {
      SCHEMA.sections.forEach(s=>{S.sel[s.id].on=s.id===v;});S.flow='single';S.singleModule=v;
    }
    S.expandedModule=v;S.panel=null;S.step='config';
    S.warn=v==='liability'&&!liabilityAllowed()?'Добавьте защиту имущества или ДМС: ответственность оформляется вместе с одним из этих видов защиты':null;
    render();window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(act==='faq-category'){ S.faqId=v; rerenderKeepScroll(); }
  else if(act==='calculator'){ if(S.sel.prop.on && !S.addresses[0].addr.trim()){S.expandedModule='prop';rerenderKeepScroll();} document.getElementById('calculator')?.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(act==='package-open'){ if(S.flow==='single') applyPreset('reco'); S.flow='package'; S.singleModule=null; S.expandedModule=S.sel.prop.on?'prop':null; S.step='config'; S.panel=null; S.warn=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if(act==='panel'){ S.panel = v; S.warn=null; rerenderKeepScroll(); }
  else if(act==='terms'){ S.panel = 'terms'; S.warn=null; rerenderKeepScroll(); }
  else if(act==='channel'){
    if(v===S.channel) return;
    S.channel = v; S.panel = null; S.warn = null;
    render(); window.scrollTo(0,0);
    app.querySelector(`[data-act="channel"][data-v="${v}"]`)?.focus({preventScroll:true});
  }
  else if(act==='panel-close'){ if(t.classList.contains('sp__scrim') && e.target!==t) return; S.panel = null; S.warn=null; rerenderKeepScroll(); }
  else if(act==='preset-go'){
    applyPreset(v); S.flow='package'; S.singleModule=null; S.expandedModule=S.sel.prop.on?'prop':null; S.step='config'; S.panel=null; S.warn=null;
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(act==='preset'){ applyPreset(v); rerenderKeepScroll(); }
  else if(act==='emp-step'){
    const max=SCHEMA.rules.maxEmployees, next=S.estimateEmployees+Number(v);
    S.empOver = next > max;
    S.estimateEmployees=Math.max(0,Math.min(max,next));
    rerenderKeepScroll();
  }
  else if(act==='staff-add'){ S.staffEdit='new'; S.staffDraft=S.staffPending || {fio:'',dob:'',phone:'',email:''}; S.staffPending=null; S.staffErr=null; rerenderKeepScroll(); }
  else if(act==='staff-menu'){ S.staffMenu = S.staffMenu===+v ? null : +v; rerenderKeepScroll(); }
  else if(act==='staff-edit'){ S.staffMenu=null; S.staffEdit=+v; S.staffDraft={...S.staff[+v]}; S.staffErr=null; rerenderKeepScroll(); }
  else if(act==='staff-cancel'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; keepStaffDraft(); S.staffEdit=null; S.staffDraft=null; S.staffErr=null; rerenderKeepScroll(); }
  else if(act==='staff-discard'){ S.staffPending=null; S.staffEdit=null; S.staffDraft=null; S.staffErr=null; rerenderKeepScroll(); }
  else if(act==='toast-close'){ S.toast=null; rerenderKeepScroll(); }
  else if(act==='staff-save' || act==='staff-save-more'){
    const d = S.staffDraft;
    d.fio = normFio(d.fio);
    S.staffErr = staffErrors(d);
    const dup = !S.staffErr.fio && S.staff.some((p,i)=>i!==S.staffEdit && p.fio.toLowerCase()===d.fio.toLowerCase() && (!d.dob.trim() || !p.dob || p.dob===d.dob.trim()));
    if(dup) S.staffErr.fio = 'Этот сотрудник уже в списке';
    if(Object.keys(S.staffErr).length){ rerenderKeepScroll(); const f=app.querySelector('[aria-invalid="true"]'); if(f) f.focus(); return; }
    if(d.phone.trim()) d.phone = fmtPhone(d.phone);
    d.email = d.email.trim(); d.dob = d.dob.trim();
    S.staffErr = null;
    const isNew = S.staffEdit==='new';
    if(isNew) S.staff.push({...d, on:true});
    else S.staff[S.staffEdit] = {...S.staff[S.staffEdit], ...d, on:true};
    showToast(isNew ? 'Сотрудник добавлен в страховку' : 'Данные сотрудника сохранены');
    if(act==='staff-save-more' && S.staff.length < SCHEMA.rules.maxEmployees){
      S.staffEdit='new'; S.staffDraft={fio:'',dob:'',phone:'',email:''}; rerenderKeepScroll(); app.querySelector('#st-fio')?.focus();
    } else { S.staffEdit=null; S.staffDraft=null; rerenderKeepScroll(); }
  }
  else if(act==='staff-del'){ S.staffMenu=null; S.staffDelete=+v; rerenderKeepScroll(); }
  else if(act==='staff-del-close'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; S.staffDelete=null; rerenderKeepScroll(); }
  else if(act==='staff-del-ok'){
    const i=S.staffDelete; S.staffDelete=null; S.staff.splice(i,1); if(S.staffEdit===i){S.staffEdit=null;S.staffDraft=null;}
    showToast('Сотрудник удалён'); lastLayer=null; rerenderKeepScroll(); app.querySelector('[data-act="staff-add"]')?.focus();
  }
  else if(act==='signway'){ S.signway = t.value || v; rerenderKeepScroll(); }
  else if(act==='consent'){ S.consent = true; rerenderKeepScroll(); }
  else if(act==='consent-close'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; S.consent = false; rerenderKeepScroll(); }
  else if(act==='code-close'){ if(t.classList.contains('dlg__scrim') && e.target!==t) return; completionSerial++;if(S.signed){S.signed=false;S.codeSession=false;}S.signing=false;clearInterval(codeTimer);rerenderKeepScroll(); }
  else if(act==='agree'){ S.agreed = !S.agreed; S.agreedFor=S.agreed?quoteKey():null; S.agreeErr=false; rerenderKeepScroll(); }
  else if(act==='start-sign'){
    if(!checkoutReady()) return;
    refreshApproval();
    if(!S.agreed){
      S.agreeErr=true; rerenderKeepScroll();
      app.querySelector('[data-act="agree"]')?.focus();
      return;
    }
    S.payMailError = VALID.email(S.payMail) || null;
    if(S.payMailError){ rerenderKeepScroll(); app.querySelector('#pay-mail')?.focus(); return; }
    if(S.channel==='sfa' && S.signway==='paper'){
      S.completedKey=quoteKey();S.step='done';S.signing=false;render();window.scrollTo({top:0,behavior:'smooth'});
    } else { S.signing=true; S.codeHelp=false; startCode(!S.codeSession); rerenderKeepScroll(); }
  }
  else if(act==='sign'){ signCode(); }
  else if(act==='code-resend'){ startCode(true); rerenderKeepScroll(); const f=app.querySelector('#code-in'); if(f) f.focus(); }
  else if(act==='code-help'){ S.codeHelp=!S.codeHelp; rerenderKeepScroll(); }
});
app.addEventListener('input', e=>{
  const slider=e.target.closest('[data-act="sum-slider"]');
  if(slider){const [sid,key]=slider.dataset.v.split(':'); if(sid==='liability') S.sel.liability.limit=+slider.value; else S.sel.prop.sums[key]=+slider.value; rerenderKeepScroll(); return;}

  const masked = e.target.closest('[data-mask]');
  let r = null;
  if(masked){ r = applyMask(masked); if(!r) return; }
  const money=e.target.closest('[data-act="sum-input"]');
  if(money){
    const [sid,key]=money.dataset.v.split(':'), n=+r.digits || 0;
    if(sid==='liability') S.sel.liability.limit=n; else S.sel.prop.sums[key]=n;
    rerenderKeepScroll();
    return;
  }
  const estimate=e.target.closest('[data-act="emp-estimate"]');
  if(estimate){
    S.estimateEmployees=+r.digits || 0; S.empOver=false;
    rerenderKeepScroll();
    return;
  }
  const a = e.target.closest('[data-act="addr"]');
  if(a){
    S.addresses[+a.dataset.v].addr = a.value;
    rerenderKeepScroll();
    return;
  }
  const mail = e.target.closest('[data-act="pay-mail"]');
  if(mail){
    S.payMail = mail.value;
    if(S.payMailError){
      S.payMailError = null;
      mail.removeAttribute('aria-invalid'); mail.removeAttribute('aria-describedby');
      mail.closest('.field')?.classList.remove('field--err');
      app.querySelector('#pay-mail-err')?.remove();
    }
    rerenderKeepScroll();
    return;
  }
  /* CodeInput: цифра — в свою ячейку, вставка раскладывается по ячейкам, фокус уходит дальше */
  const cell = e.target.closest('[data-act="code-cell"]');
  if(cell){
    const i = +cell.dataset.i, d = cell.value.replace(/\D/g,'');
    if(!d){ cell.value = S.codeArr[i]||''; return; }
    d.split('').forEach((ch,k)=>{ if(i+k < CODE_LEN) S.codeArr[i+k] = ch; });
    syncCode(); cell.value = S.codeArr[i];
    const next = Math.min(i + d.length, CODE_LEN - 1);
    S.codeWrong = false;
    rerenderKeepScroll();
    if(next!==i) app.querySelector(`[data-act="code-cell"][data-i="${next}"]`)?.focus();
    if(S.code.length===CODE_LEN) signCode();
    return;
  }
  const f = e.target.closest('[data-act="staff-f"]');
  if(f && S.staffDraft){
    S.staffDraft[f.dataset.v] = f.value;
    saveDraft();
    if(S.staffErr && S.staffErr[f.dataset.v] && !VALID[f.dataset.v](f.value)){
      delete S.staffErr[f.dataset.v]; f.removeAttribute('aria-invalid'); f.closest('.field').classList.remove('field--err');
      const e=document.getElementById(`st-${f.dataset.v}-err`); if(e) e.remove();
    }
  }
});
app.addEventListener('change', e=>{
  const t = e.target.closest('[data-act]'); if(!t) return;
  if(t.dataset.act==='module-input'){
    const id=t.dataset.v; S.sel[id].on=t.checked;
    if(t.checked) S.expandedModule=id;
    else if(S.expandedModule===id) S.expandedModule=null;
    S.warn=null; rerenderKeepScroll(); return;
  }
  if(t.dataset.act==='sum-input'){ S.touched[t.id]=true; rerenderKeepScroll(); return; }
  if(t.dataset.act==='opt-input'){
    const [sid,oid]=t.dataset.v.split(':');
    S.sel[sid].opts=t.checked?[...S.sel[sid].opts.filter(x=>x!==oid),oid]:S.sel[sid].opts.filter(x=>x!==oid);
    S.warn=null; rerenderKeepScroll(); return;
  }
  if(t.dataset.act==='pay-acc'){ S.payAccount = +t.value; rerenderKeepScroll(); return; }
  if(t.dataset.act==='signway'){ S.signway = t.value; rerenderKeepScroll(); return; }
  if(t.dataset.act==='dms-program'){ S.sel.dms.program = t.value; rerenderKeepScroll(); return; }

});
/* Esc закрывает верхний слой: диалог подтверждения → боковая панель раздела */
/* Клавиши в полях с маской: Backspace/Delete перешагивают разделитель и стирают цифру за ним */
app.addEventListener('keydown', e=>{
  const el = e.target;
  if(el.dataset?.mask && (e.key==='Backspace' || e.key==='Delete') && el.selectionStart===el.selectionEnd){
    const p = el.selectionStart, pre = MASKS[el.dataset.mask].prefix?.length || 0;
    if(e.key==='Backspace' && p > pre && /\D/.test(el.value[p-1])) el.setSelectionRange(p-1, p-1);
    if(e.key==='Delete' && p < el.value.length && /\D/.test(el.value[p])) el.setSelectionRange(p+1, p+1);
    if(e.key==='Backspace' && p <= pre && pre){ e.preventDefault(); }
  }
  if(el.dataset?.act==='code-cell'){
    const i = +el.dataset.i, go = j => app.querySelector(`[data-act="code-cell"][data-i="${j}"]`)?.focus();
    if(e.key==='Backspace'){ e.preventDefault(); const t = S.codeArr[i] ? i : Math.max(i-1,0); S.codeArr[t]=''; syncCode(); rerenderKeepScroll(); go(t); }
    else if(e.key==='Delete'){ e.preventDefault(); S.codeArr[i]=''; syncCode(); rerenderKeepScroll(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); if(i>0) go(i-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); if(i<CODE_LEN-1) go(i+1); }
    else if(e.key==='ArrowUp' || e.key==='ArrowDown'){ e.preventDefault(); }
  }
});
/* CodeInput: фокус в пустой код всегда начинается с первой ячейки; цифра в ячейке выделяется */
app.addEventListener('focusin', e=>{
  const el = e.target;
  if(el.dataset?.act==='code-cell'){
    if(+el.dataset.i > 0 && !S.codeArr[0]){ app.querySelector('#code-in')?.focus(); return; }
    if(el.value) el.select();
  }
  if(el.dataset?.mask) el.dataset.prev = el.value;
});
/* Ведущие нули убираются при уходе из поля, как в AmountInput: значение берётся из состояния */
app.addEventListener('focusout', e=>{
  if(e.target.dataset?.act==='addr'){
    S.touched['addr-0']=true;
    if(!S.addresses[0].addr.trim()) setTimeout(rerenderKeepScroll);
  }
  if(e.target.dataset?.act==='staff-f' && e.target.dataset.v==='fio' && S.staffDraft){
    const v = normFio(e.target.value); if(v!==e.target.value){ e.target.value = v; S.staffDraft.fio = v; }
  }
  const m = e.target.dataset?.mask;
  if(m==='amount' || m==='count') setTimeout(rerenderKeepScroll);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.dataset?.act==='code-cell'){ signCode(); return; }
  if(e.key !== 'Escape') return;
  if(S.staffMenu!=null){ const i=S.staffMenu; S.staffMenu=null; rerenderKeepScroll(); app.querySelector(`[data-act="staff-menu"][data-v="${i}"]`)?.focus(); return; }
  if(S.consent){ S.consent = false; rerenderKeepScroll(); return; }
  if(S.mismatch || S.managerReq || S.explain || S.staffDelete!=null){ Object.assign(S, {mismatch:false, managerReq:false, explain:null, staffDelete:null}); rerenderKeepScroll(); return; }
  if(S.staffEdit!==null){ keepStaffDraft(); S.staffEdit=null; S.staffDraft=null; S.staffErr=null; rerenderKeepScroll(); return; }
  if(S.signing){completionSerial++;if(S.signed){S.signed=false;S.codeSession=false;}S.signing=false;clearInterval(codeTimer);rerenderKeepScroll();return;}
  if(S.panel){ S.panel = null; S.warn = null; rerenderKeepScroll(); }
});
/* Закрытая крестиком или Esc форма нового сотрудника не теряет введённое */
function keepStaffDraft(){
  if(S.staffEdit==='new' && S.staffDraft && Object.values(S.staffDraft).some(x=>String(x).trim())) S.staffPending = {...S.staffDraft};
}
if(typeof window!=='undefined' && window.addEventListener) window.addEventListener('popstate', e=>{
  const step = e.state?.step;
  histIdx = e.state?.i || 0;
  closeLayers();
  let target=FLOW.includes(step)?step:'showcase';
  if(S.step==='done' && target!=='done') S.completedKey=null;
  if(target==='done' && S.completedKey!==quoteKey()) target='checkout';
  const problem=routeProblem(target);
  if(problem) applyRouteProblem(problem);else S.step=target;
  // Replace an invalid history destination instead of adding another step.
  if(history.state?.step!==S.step) history.replaceState({step:S.step,i:histIdx},'', '#'+S.step);
  render();window.scrollTo(0,0);if(problem) focusRouteProblem(problem);
});
{ const d = loadDraft(); if(d){ Object.assign(S, d); showToast('Восстановили оформление'); } }
render();
document.documentElement.lang = "ru";
</script>
